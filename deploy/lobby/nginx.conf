# Global limit, independent of the client-provided address. This also bounds
# slow request bodies and requests waiting for the single mapbuilder worker.
limit_conn_zone $server_name zone=mapbuilder_connections:1m;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    # Caddy terminates HTTPS in front, so redirects such as /heroes3/editor -> /heroes3/editor/ stay relative
    absolute_redirect off;
    client_header_timeout 10s;
    client_body_timeout 10s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Pages and maps are replaced in place under the same names; browsers revalidate them on every visit
    location /heroes3/ {
        root   /usr/share/nginx/html;
        index  index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Terrain painter backend; resolved per request, so the website starts even while the map builder is down
    location /heroes3/api/ {
        limit_conn mapbuilder_connections 8;
        limit_conn_status 503;
        resolver 127.0.0.11 valid=30s;
        set $mapbuilder http://mapbuilder:8080;
        proxy_pass $mapbuilder;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        client_max_body_size 3m;
        proxy_read_timeout 90s;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
