services:
  website:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html/heroes3:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - managed-ingress
    mem_limit: 128m
    cpus: 0.5
    logging:
      options:
        max-size: 10m
        max-file: "3"
  mapbuilder:
    build: ./mapbuilder
    restart: unless-stopped
    volumes:
      - ./mapbuilder/data:/home/builder/.local/share/vcmi/Data:ro
    mem_limit: 768m
    cpus: 1
    logging:
      options:
        max-size: 10m
        max-file: "3"
  lobby:
    build: .
    restart: unless-stopped
    ports:
      - "3031:3031/tcp"
    volumes:
      - lobby-data:/home/lobby/.local/share/vcmi
    mem_limit: 512m
    cpus: 1
    logging:
      options:
        max-size: 10m
        max-file: "3"
volumes:
  lobby-data:
networks:
  managed-ingress:
    name: platform-managed-production_managed-ingress
    external: true
